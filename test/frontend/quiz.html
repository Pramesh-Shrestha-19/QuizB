<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>QuizB - Quiz</title>
  <link rel="stylesheet" href="./quiz.css" />
  <style>
    /* Hide all auth modals on quiz page */
    #loginModal,
    #signupModal,
    #forgetPasswordModal {
      display: none !important;
    }
    
    /* Disable login button and menu icon during quiz */
    #loginLink,
    .menu-icon {
      pointer-events: none;                                                               /* Disable clicking */
      opacity: 0.5;                                                                      /* Make it look disabled */
      cursor: not-allowed !important;                                                   /* Show "not allowed" cursor */
    }
    
    #loginLink:hover,
    .menu-icon:hover {
      opacity: 0.3;
    }
  </style>
</head>
<body>

  <!-- Backdrop Blur -->
    <div id="blur-overlay"></div>

    <!-- Header -->
    <header class="header">
        <div class="logo">QuizB</div>
        <div class="right-controls">
            <a class="login-btn" id="loginLink">Login</a>
            <div class="menu-icon" onclick="toggleSidebar()">☰</div>
        </div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <a href="test.html">Home</a>
        <a href="categories.html">Quizzes</a>
        <a>Leaderboard</a>
        <a href="#">Settings</a>
        <a href="#" class="logout">Logout</a>
    </aside>

  <div id="quiz-container">
    <header id="quiz-header">
      <h1 id="quiz-title">QuizB</h1>
      <div id="meta">
        <span id="category-label"></span>
        <span id="progress"></span>
      </div>
    </header>

    <main id="question-box">
      <h2 id="question-text">Loading...</h2>
      <div id="options" role="list"></div>

      <div id="controls">
        <button id="next-btn" disabled>Next</button>
        <button id="quit-btn">Quit</button>
      </div>
    </main>

    <section id="result-box" style="display:none">
      <h2>Quiz Result</h2>
      <p id="score-text"></p>
      <p id="time-text"></p>
      <div class="result-actions">
        <button id="retry-btn">Retry</button>
        <button id="back-btn">Back to Categories</button>
      </div>
    </section>
  </div>

  <script src="./quiz.js"></script>
  <script src="auth.js"></script>
</body>
</html>
