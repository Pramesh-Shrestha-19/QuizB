<!-- Login Modal -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <form id="loginForm">
            <h1>Login</h1>
            <div class="inputbox">
                <input type="text" name="username" required>
                <label>Username</label>
                <ion-icon name="person-outline"></ion-icon>
            </div>
            <div class="inputbox password-box">
                <input type="password" id="password" required placeholder=" " name="password">
                <label for="password">Password</label>
                <ion-icon class="lock-icon" name="lock-closed-outline"></ion-icon>
                <ion-icon class="toggle-password" name="eye-outline"></ion-icon>
            </div>
            <div class="forget">
                <label><input type="checkbox"> Remember Me</label>
                <a href="#">Forget Password</a>
            </div>
            <button type="submit">Log in</button>
            <div class="register">
                <p>Don't have an account? <a id="registerLink">Register</a></p>
            </div>
        </form>
    </div>
</div>

<!-- Signup Modal -->
<div id="signupModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <form id="signupForm">
            <h1>Sign Up</h1>
            <div class="inputbox">
                <input type="text" name="username" required>
                <label>Username</label>
                <ion-icon name="person-outline"></ion-icon>
            </div>
            <div class="inputbox">
                <input type="email" name="email" placeholder=" " required>                  <!--Remember. Keep the placeholder empty.-->
                <label>Email</label>
                <ion-icon name="mail-outline"></ion-icon>
            </div>
            <div class="inputbox password-box">
                <input type="password" id="signupPassword" required placeholder=" ">
                <label for="signupPassword">Password</label>
                <ion-icon class="lock-icon" name="lock-closed-outline"></ion-icon>
                <ion-icon class="toggle-password" name="eye-outline"></ion-icon>
            </div>
            <div class="inputbox password-box">
                <input type="password" id="confirmPassword" required placeholder=" ">
                <label for="confirmPassword">Confirm Password</label>
                <ion-icon class="lock-icon" name="lock-closed-outline"></ion-icon>
                <ion-icon class="toggle-password" name="eye-outline"></ion-icon>
            </div>
            <button type="submit">Register</button>
            <div class="register">
                <p>Already have an account? <a id="openLogin">Login</a></p>
            </div>
        </form>
    </div>
</div>

<!-- Forget Password Modal -->
<div id="forgetPasswordModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>

        <!-- Step 1: Enter Email -->
        <form id="forgetPasswordForm" class="step1">
            <h1>Reset Password</h1>
            <div class="inputbox">
                <input type="email" name="email" required placeholder=" ">
                <label>Email</label>
                <ion-icon name="mail-outline"></ion-icon>
            </div>
            <button type="submit">Send Reset Code</button>
        </form>

        <!-- Step 2: Enter Reset Code + New Password -->
        <form id="resetPasswordForm" class="step2" style="display:none;">
            <h1>Enter Reset Code</h1>
            <div class="inputbox">
                <input type="text" name="reset_code" required placeholder=" ">
                <label>Reset Code</label>
            </div>
            <div class="inputbox password-box">
                <input type="password" name="new_password" required placeholder=" ">
                <label>New Password</label>
                <ion-icon class="lock-icon" name="lock-closed-outline"></ion-icon>
                <ion-icon class="toggle-password" name="eye-outline"></ion-icon>
            </div>
            <div class="inputbox password-box">
                <input type="password" name="confirm_password" required placeholder=" ">
                <label>Confirm Password</label>
                <ion-icon class="lock-icon" name="lock-closed-outline"></ion-icon>
                <ion-icon class="toggle-password" name="eye-outline"></ion-icon>
            </div>
            <button type="submit">Reset Password</button>
        </form>
    </div>
</div>
